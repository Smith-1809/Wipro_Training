<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Customer Engagement Dashboard</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>

<body class="bg-light">

<div class="container mt-5">

    <h2 class="text-center mb-4">Customer Engagement Dashboard</h2>

    <!-- ===================== NAV TABS ===================== -->
    <ul class="nav nav-tabs mb-4">
        <li class="nav-item">
            <button class="nav-link active"
                    data-bs-toggle="tab"
                    data-bs-target="#ticketsTab">
                Tickets
            </button>
        </li>
        <li class="nav-item">
            <button class="nav-link"
                    data-bs-toggle="tab"
                    data-bs-target="#customersTab">
                Customers
            </button>
        </li>
    </ul>

    <div class="tab-content">

        <!-- ===================== TICKETS TAB ===================== -->
        <div class="tab-pane fade show active" id="ticketsTab">

            <!-- SEARCH + FILTER -->
            <div class="row mb-3">
                <div class="col-md-6">
                    <input type="text"
                           id="ticketSearch"
                           class="form-control"
                           placeholder="Search tickets..."
                           onkeyup="applyTicketFilters()">
                </div>

                <div class="col-md-4">
                    <select id="ticketStatusFilter"
                            class="form-select"
                            onchange="applyTicketFilters()">
                        <option value="all">All Status</option>
                        <option value="0">Open</option>
                        <option value="1">In Progress</option>
                        <option value="2">Resolved</option>
                    </select>
                </div>
            </div>

            <div class="d-flex justify-content-end mb-3">
                <button class="btn btn-primary"
                        data-bs-toggle="modal"
                        data-bs-target="#ticketModal">
                    Create Ticket
                </button>
            </div>

            <table class="table table-bordered table-striped">
                <thead class="table-dark">
                <tr>
                    <th>Ticket Id</th>
                    <th>Title</th>
                    <th>Status</th>
                    <th>Created At</th>
                    <th>Action</th>
                </tr>
                </thead>
                <tbody id="ticketTableBody"></tbody>
            </table>

        </div>

        <!-- ===================== CUSTOMERS TAB ===================== -->
        <div class="tab-pane fade" id="customersTab">

            <div class="d-flex justify-content-end mb-3">
                <button class="btn btn-success"
                        data-bs-toggle="modal"
                        data-bs-target="#customerModal">
                    Create Customer
                </button>
            </div>

            <table class="table table-bordered table-striped">
                <thead class="table-dark">
                <tr>
                    <th>Customer Id</th>
                    <th>Full Name</th>
                    <th>Email</th>
                    <th>Phone</th>
                </tr>
                </thead>
                <tbody id="customerTableBody"></tbody>
            </table>

        </div>

    </div>
</div>

<!-- ===================== CREATE TICKET MODAL ===================== -->
<div class="modal fade" id="ticketModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">

            <div class="modal-header">
                <h5 class="modal-title">Create Ticket</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>

            <div class="modal-body">

                <div class="mb-3">
                    <label class="form-label">Customer Id</label>
                    <input type="text" id="ticketCustomerId" class="form-control">
                </div>

                <div class="mb-3">
                    <label class="form-label">Agent Id</label>
                    <input type="text" id="ticketAgentId" class="form-control">
                </div>

                <div class="mb-3">
                    <label class="form-label">Category Id</label>
                    <input type="number" id="ticketCategoryId" class="form-control">
                </div>

                <div class="mb-3">
                    <label class="form-label">Title</label>
                    <input type="text" id="ticketTitle" class="form-control">
                </div>

                <div class="mb-3">
                    <label class="form-label">Description</label>
                    <textarea id="ticketDescription" class="form-control"></textarea>
                </div>

            </div>

            <div class="modal-footer">
                <button class="btn btn-secondary" data-bs-dismiss="modal">
                    Cancel
                </button>
                <button class="btn btn-primary" onclick="handleCreateTicket(event)">
                    Create
                </button>
            </div>

        </div>
    </div>
</div>

<!-- ===================== CREATE CUSTOMER MODAL ===================== -->
<div class="modal fade" id="customerModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">

            <div class="modal-header">
                <h5 class="modal-title">Create Customer</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>

            <div class="modal-body">

                <div class="mb-3">
                    <label class="form-label">Full Name</label>
                    <input type="text" id="customerName" class="form-control">
                </div>

                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" id="customerEmail" class="form-control">
                </div>

                <div class="mb-3">
                    <label class="form-label">Phone</label>
                    <input type="text" id="customerPhone" class="form-control">
                </div>

            </div>

            <div class="modal-footer">
                <button class="btn btn-secondary" data-bs-dismiss="modal">
                    Cancel
                </button>
                <button class="btn btn-success" onclick="handleCreateCustomer(event)">
                    Create
                </button>
            </div>

        </div>
    </div>
</div>

<!-- ===================== TOAST ===================== -->
<div class="toast-container position-fixed bottom-0 end-0 p-3">
    <div id="appToast" class="toast align-items-center text-bg-success border-0">
        <div class="d-flex">
            <div class="toast-body" id="toastMessage"></div>
            <button type="button"
                    class="btn-close btn-close-white me-2 m-auto"
                    data-bs-dismiss="toast"></button>
        </div>
    </div>
</div>

<!-- ===================== SCRIPTS ===================== -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/ui.js"></script>
<script src="js/tickets.js"></script>
<script src="js/customers.js"></script>
<script src="js/app.js"></script>

</body>
</html>
