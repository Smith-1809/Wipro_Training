<!DOCTYPE html>
<html>
<head>
    <title>Student Portal</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

<nav class="navbar navbar-dark bg-primary px-3">
    <span class="navbar-brand">Spring Flowers School</span>
    <a href="#timetable" class="btn btn-light">TimeTable</a>
</nav>

<div class="container text-center mt-5">
    <h1>Welcome Student 👋</h1>
    <p>Click timetable to view your classes</p>
</div>

<section id="timetable" class="container mt-5">
    <h2>My Time Table</h2>

    <div class="table-responsive">
        <table class="table table-bordered text-center">
            <tr>
                <th>Day</th>
                <th>9-10</th>
                <th>10-11</th>
                <th>11-12</th>
            </tr>

            <tr>
                <td>Monday</td>
                <td>Maths</td>
                <td>Physics</td>
                <td>English</td>
            </tr>

            <tr>
                <td>Tuesday</td>
                <td>Chemistry</td>
                <td>Maths</td>
                <td>Computer</td>
            </tr>
        </table>
    </div>

</section>

</body>
</html>
